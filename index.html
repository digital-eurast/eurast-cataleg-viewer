<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Tarifa — EURAST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:   #ED692C;
      --primary-h: #d45a1e;
      --surface:   #FAF6F5;
      --text:      #333436;
      --border:    #E2DCD9;
      --grey-lt:   #EBECED;
      --grey-md:   #A9A9AA;
    }

    html, body {
      height: 100%;
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: var(--surface);
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 200;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo-img {
      height: 36px;
      width: auto;
      display: block;
    }
    .logo-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--grey-md);
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .divider { width: 1px; height: 24px; background: var(--border); }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--grey-lt);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 3px 7px;
    }
    .ctrl-group button {
      background: none; border: none;
      color: var(--grey-md);
      font-size: 17px; line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all .1s;
      font-family: inherit;
    }
    .ctrl-group button:hover { background: var(--border); color: var(--text); }
    .ctrl-group button:disabled { opacity: .3; cursor: default; }
    .ctrl-group input {
      width: 42px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      text-align: center;
      border-radius: 4px;
      padding: 2px 3px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
    }
    .ctrl-group span {
      font-size: 12px;
      color: var(--grey-md);
      font-weight: 500;
    }

    .btn-dl {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-dl:hover { background: var(--primary-h); }

    /* ── LAYOUT ── */
    .layout {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 210px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── LANGUAGE TABS ── */
    .lang-tabs {
      display: flex;
      gap: 3px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .lang-btn {
      flex: 1;
      padding: 5px 0;
      border: 1px solid var(--border);
      background: none;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--grey-md);
      cursor: pointer;
      transition: all .12s;
      font-family: inherit;
    }
    .lang-btn:hover { background: var(--grey-lt); color: var(--text); }
    .lang-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--grey-md);
      text-transform: uppercase;
      padding: 0 6px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 7px;
      cursor: pointer;
      transition: background .12s;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover { background: var(--grey-lt); }
    .nav-item.active { background: rgba(237,105,44,.10); }
    .nav-item.active .nav-badge { background: var(--primary); color: #fff; }
    .nav-item.active .nav-name { color: var(--primary); font-weight: 700; }

    .nav-badge {
      flex-shrink: 0;
      background: var(--grey-lt);
      color: var(--grey-md);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      padding: 2px 5px;
      border-radius: 4px;
      min-width: 28px;
      text-align: center;
      transition: background .12s, color .12s;
    }
    .nav-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
      transition: color .12s;
    }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
    }
    .viewer::-webkit-scrollbar { width: 7px; }
    .viewer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .page-slot {
      display: block;
      margin: 0 auto 12px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(57,72,90,0.10), 0 0 0 1px rgba(0,0,0,0.04);
      position: relative;
    }
    .page-slot canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── PAGE LOADER (per slot) ── */
    .page-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      gap: 14px;
      pointer-events: none;
    }
    .page-loader-logo {
      height: 40px;
      width: auto;
      opacity: 0;
      animation: plsFadeIn .6s ease forwards, plsPulse 2s ease-in-out 0.6s infinite;
    }
    @keyframes plsFadeIn {
      to { opacity: .7; }
    }
    @keyframes plsPulse {
      0%, 100% { opacity: .4; }
      50%       { opacity: .9; }
    }
    .page-loader-bar {
      width: 64px;
      height: 3px;
      background: var(--grey-lt);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .page-loader-bar::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40px;
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      animation: plsSlide 1s ease-in-out infinite;
    }
    @keyframes plsSlide {
      0%   { transform: translateX(-40px); }
      100% { transform: translateX(64px); }
    }

    /* ── FULL-SCREEN LOADING OVERLAY ── */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
      transition: opacity .4s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

    .loading-logo {
      height: 64px;
      width: auto;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-pct { font-size: 21px; font-weight: 700; color: var(--primary); }
    .loading-sub { font-size: 12px; color: var(--grey-md); font-weight: 500; }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <img src="logo.png" class="loading-logo" alt="EURAST">
  <div class="spinner"></div>
  <div class="loading-pct" id="pct">0%</div>
  <div class="loading-sub" id="loading-sub">La primera página aparecerá en unos segundos</div>
</div>

<header>
  <div class="logo">
    <img src="logo.png" class="logo-img" alt="EURAST">
    <div class="logo-label" id="header-label">Catálogo Tarifa RCR Completa</div>
  </div>
  <div class="toolbar">
    <div class="ctrl-group">
      <button id="btnPrev" disabled>‹</button>
      <input id="pageInput" type="number" value="1" min="1">
      <span>/ <span id="totalLbl">—</span></span>
      <button id="btnNext">›</button>
    </div>
    <div class="divider"></div>
    <div class="ctrl-group">
      <button id="btnZoomOut">−</button>
      <span id="zoomLbl">100%</span>
      <button id="btnZoomIn">+</button>
    </div>
    <div class="divider"></div>
    <a class="btn-dl" id="btn-dl" href="cataleg.pdf" download>↓ Descargar PDF</a>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="lang-tabs">
      <button class="lang-btn active" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="de">DE</button>
    </div>
    <div class="nav-label" id="nav-label">Grupos</div>
  </div>
  <div class="viewer" id="viewer"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

// ── STATE ──────────────────────────────────────────────────────────
const PRERENDER  = 2;
const UNLOAD_FAR = 8;

const viewer  = document.getElementById('viewer');
const sidebar = document.getElementById('sidebar');

let pdf, totalPages, zoom = 1.0, currentPage = 1;
const slots    = [];
const rendered = new Set();

// ── UI STRINGS (multilingual) ──────────────────────────────────────
const STRINGS = {
  es: { navLabel: 'Grupos',  headerSub: 'Catálogo Tarifa RCR Completa',   download: '↓ Descargar PDF',     loading: '0%', loadingSub: 'La primera página aparecerá en unos segundos' },
  en: { navLabel: 'Groups',  headerSub: 'RCR Complete Price List',         download: '↓ Download PDF',      loading: '0%', loadingSub: 'The first page will appear in a few seconds' },
  fr: { navLabel: 'Groupes', headerSub: 'Catalogue Tarif RCR Complet',     download: '↓ Télécharger PDF',   loading: '0%', loadingSub: 'La première page apparaîtra dans quelques secondes' },
  de: { navLabel: 'Gruppen', headerSub: 'RCR Vollständiger Preiskatalog',  download: '↓ PDF herunterladen', loading: '0%', loadingSub: 'Die erste Seite erscheint in wenigen Sekunden' },
};
let currentLang = 'es';

// ── GROUPS — multilingual, declared at top ─────────────────────────
const GROUPS = [
  { id: 'G01', page:   1, es: 'Máquinas Bar',       en: 'Bar Machines',             fr: 'Machines Bar',              de: 'Barmaschinen' },
  { id: 'G02', page:  47, es: 'Cocinas 450/550',     en: 'Cooking Ranges 450/550',   fr: 'Cuisinières 450/550',       de: 'Kochgeräte 450/550' },
  { id: 'G03', page:  65, es: 'Cocinas 600',         en: 'Cooking Ranges 600',       fr: 'Cuisinières 600',           de: 'Kochgeräte 600' },
  { id: 'G04', page:  93, es: 'Cocinas 700',         en: 'Cooking Ranges 700',       fr: 'Cuisinières 700',           de: 'Kochgeräte 700' },
  { id: 'G05', page: 151, es: 'Cocinas 900',         en: 'Cooking Ranges 900',       fr: 'Cuisinières 900',           de: 'Kochgeräte 900' },
  { id: 'G06', page: 207, es: 'Gran Producción',     en: 'Large Scale Production',   fr: 'Grande Production',         de: 'Großproduktion' },
  { id: 'G07', page: 248, es: 'Equipos Calientes',   en: 'Hot Equipment',            fr: 'Équipements Chauds',        de: 'Heißgeräte' },
  { id: 'G08', page: 286, es: 'Hornos / Ovens',      en: 'Ovens',                    fr: 'Fours',                     de: 'Öfen' },
  { id: 'G09', page: 342, es: 'Asadores & BBQ',      en: 'Grills & BBQ',             fr: 'Rôtissoires & BBQ',         de: 'Grills & BBQ' },
  { id: 'G10', page: 391, es: 'Campanas',            en: 'Hoods',                    fr: 'Hottes',                    de: 'Dunstabzugshauben' },
  { id: 'G11', page: 425, es: 'Frío Industrial',     en: 'Industrial Refrigeration', fr: 'Réfrigération Industrielle',de: 'Industriekühlung' },
  { id: 'G12', page: 498, es: 'Vitrinas',            en: 'Display Cases',            fr: 'Vitrines Réfrigérées',      de: 'Vitrinen' },
  { id: 'G13', page: 590, es: 'Lavado / Washing',    en: 'Warewashing',              fr: 'Lavage / Plonge',           de: 'Spülgeräte' },
  { id: 'G14', page: 662, es: 'Elementos Neutros',   en: 'Neutral Equipment',        fr: 'Éléments Neutres',          de: 'Neutrale Elemente' },
  { id: 'G15', page: 733, es: 'Drop-in / Buffets',   en: 'Drop-in / Buffets',        fr: 'Drop-in / Buffets',         de: 'Drop-in / Büfetts' },
  { id: 'G16', page: 817, es: 'Maquinaria Auxiliar', en: 'Auxiliary Machinery',      fr: 'Machines Auxiliaires',      de: 'Hilfsmaschinen' },
];

// ── LOAD PDF ───────────────────────────────────────────────────────
const task = pdfjsLib.getDocument({ url: 'cataleg.pdf', rangeChunkSize: 65536 });
task.onProgress = ({ loaded, total }) => {
  if (total) document.getElementById('pct').textContent =
    Math.round(loaded / total * 100) + '%';
};
pdf = await task.promise;
totalPages = pdf.numPages;

document.getElementById('totalLbl').textContent = totalPages;
document.getElementById('pageInput').max = totalPages;
document.getElementById('btnNext').disabled = totalPages <= 1;

// Hide loading overlay
const overlay = document.getElementById('loadingOverlay');
overlay.classList.add('hidden');
setTimeout(() => overlay.remove(), 500);

// ── SAMPLE PAGE RATIO (with A4 fallback) ──────────────────────────
// Wrap in try/catch with timeout so a failed getPage(1) doesn't
// stop initialization
let sampleRatio = 297 / 210; // A4 default
try {
  const ratioTimer = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000));
  const samplePage = await Promise.race([pdf.getPage(1), ratioTimer]);
  const sampleVP   = samplePage.getViewport({ scale: 1 });
  sampleRatio      = sampleVP.height / sampleVP.width;
} catch(e) {
  console.warn('samplePage failed, using A4 ratio:', e.message);
}

// ── CALC PAGE WIDTH ────────────────────────────────────────────────
function calcPageWidth() {
  const vW = viewer.clientWidth  || (window.innerWidth  - 210);
  const vH = viewer.clientHeight || (window.innerHeight - 52);
  if (vW < 10) return 800;
  const fitByH = Math.max(vH - 24, 100) / sampleRatio;
  const maxW   = vW - 8;
  return Math.min(fitByH, maxW) * zoom;
}

// ── BUILD PAGE SLOTS ───────────────────────────────────────────────
const LOADER_HTML = '<div class="page-loader"><img src="logo.png" class="page-loader-logo" alt=""><div class="page-loader-bar"></div></div>';

function buildSlots() {
  const w = calcPageWidth();
  viewer.innerHTML = '';
  slots.length = 0;
  rendered.clear();

  for (let i = 1; i <= totalPages; i++) {
    const h    = Math.round(w * sampleRatio);
    const slot = document.createElement('div');
    slot.className     = 'page-slot';
    slot.id            = `p${i}`;
    slot.dataset.page  = i;
    slot.style.width   = w + 'px';
    slot.style.height  = h + 'px';
    slot.innerHTML     = LOADER_HTML;
    viewer.appendChild(slot);
    slots.push(slot);
  }
}

// Wait for layout before measuring viewport
await new Promise(r => setTimeout(r, 50));
buildSlots();

// ── RENDER PAGE INTO SLOT ──────────────────────────────────────────
const renderQueue = new Map();

async function renderSlot(num) {
  if (rendered.has(num)) return;
  if (renderQueue.has(num)) return renderQueue.get(num);

  const promise = (async () => {
    const slot = slots[num - 1];
    if (!slot) return;

    const page  = await pdf.getPage(num);
    const scale = calcPageWidth() / page.getViewport({ scale: 1 }).width;
    const vp    = page.getViewport({ scale });

    slot.style.width  = vp.width  + 'px';
    slot.style.height = vp.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.width  = vp.width;
    canvas.height = vp.height;
    slot.appendChild(canvas);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    rendered.add(num);
    slot.querySelector('.page-loader')?.remove();
  })();

  renderQueue.set(num, promise);
  await promise;
  renderQueue.delete(num);
}

function unloadSlot(num) {
  if (!rendered.has(num)) return;
  const slot = slots[num - 1];
  if (!slot) return;
  slot.innerHTML = LOADER_HTML;
  rendered.delete(num);
}

// ── VIRTUAL SCROLL OBSERVER ────────────────────────────────────────
let observerReady = false;

const pageObs = new IntersectionObserver(entries => {
  if (!observerReady) return;
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const n = parseInt(e.target.dataset.page);
    currentPage = n;
    updateNav(n);
    for (let i = Math.max(1, n - PRERENDER); i <= Math.min(totalPages, n + PRERENDER); i++) {
      renderSlot(i);
    }
    rendered.forEach(r => {
      if (Math.abs(r - n) > UNLOAD_FAR) unloadSlot(r);
    });
  });
}, { root: viewer, threshold: 0.3 });

slots.forEach(s => pageObs.observe(s));
viewer.scrollTop = 0;
updateNav(1);

// ── BUILD SIDEBAR GROUP BUTTONS ────────────────────────────────────
GROUPS.forEach((g, idx) => {
  const btn = document.createElement('button');
  btn.className = 'nav-item' + (idx === 0 ? ' active' : '');
  btn.id        = `nav-${g.id}`;
  btn.innerHTML = `<span class="nav-badge">${g.id}</span><span class="nav-name">${g[currentLang]}</span>`;
  btn.addEventListener('click', () => goTo(g.page));
  sidebar.appendChild(btn);
});

// ── LANGUAGE SWITCHER ──────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('nav-label').textContent      = STRINGS[lang].navLabel;
  document.getElementById('header-label').textContent   = STRINGS[lang].headerSub;
  document.getElementById('btn-dl').textContent         = STRINGS[lang].download;
  GROUPS.forEach(g => {
    const btn = document.getElementById(`nav-${g.id}`);
    if (btn) btn.querySelector('.nav-name').textContent = g[lang];
  });
}

document.querySelectorAll('.lang-btn').forEach(btn =>
  btn.addEventListener('click', () => setLang(btn.dataset.lang)));

// ── RENDER INITIAL PAGES ───────────────────────────────────────────
try {
  await renderSlot(1);
} catch(e) { console.warn('renderSlot 1:', e); }
renderSlot(2).catch(() => {});

setTimeout(() => { observerReady = true; }, 300);

// ── ACTIVE GROUP HIGHLIGHT ─────────────────────────────────────────
function updateActiveGroup(pageNum) {
  let activeGroup = GROUPS[0];
  for (const g of GROUPS) {
    if (pageNum >= g.page) activeGroup = g;
    else break;
  }
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById(`nav-${activeGroup.id}`);
  if (activeEl) {
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ block: 'nearest' });
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────
function updateNav(n) {
  document.getElementById('pageInput').value    = n;
  document.getElementById('btnPrev').disabled   = n <= 1;
  document.getElementById('btnNext').disabled   = n >= totalPages;
  updateActiveGroup(n);
}

function goTo(n) {
  n = Math.max(1, Math.min(totalPages, n));
  const dist = Math.abs(n - currentPage);

  if (dist > 4) {
    // Long jump: disable observer, pre-render destination, instant scroll
    observerReady = false;
    currentPage   = n;
    updateNav(n);
    renderSlot(n);
    for (let i = Math.max(1, n - PRERENDER); i <= Math.min(totalPages, n + PRERENDER); i++) {
      renderSlot(i);
    }
    slots[n - 1]?.scrollIntoView({ behavior: 'instant', block: 'start' });
    setTimeout(() => { observerReady = true; }, 350);
  } else {
    slots[n - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

document.getElementById('btnPrev').addEventListener('click', () => goTo(currentPage - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(currentPage + 1));
document.getElementById('pageInput').addEventListener('change', e => goTo(parseInt(e.target.value) || 1));

// ── ZOOM ───────────────────────────────────────────────────────────
function applyZoom() {
  document.getElementById('zoomLbl').textContent = Math.round(zoom * 100) + '%';
  const w = calcPageWidth();
  slots.forEach(s => {
    s.style.width  = w + 'px';
    s.style.height = Math.round(w * sampleRatio) + 'px';
  });
  rendered.clear();
  slots.forEach(s => { s.innerHTML = LOADER_HTML; });
  renderSlot(currentPage);
  for (let i = Math.max(1, currentPage - PRERENDER); i <= Math.min(totalPages, currentPage + PRERENDER); i++) {
    renderSlot(i);
  }
}

document.getElementById('btnZoomIn').addEventListener('click', () => {
  zoom = Math.min(zoom + 0.25, 3.0);
  applyZoom();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  zoom = Math.max(zoom - 0.25, 0.5);
  applyZoom();
});

// ── RESIZE ────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    rendered.clear();
    slots.forEach(s => { s.innerHTML = LOADER_HTML; });
    const w = calcPageWidth();
    slots.forEach(s => {
      s.style.width  = w + 'px';
      s.style.height = Math.round(w * sampleRatio) + 'px';
    });
    for (let i = Math.max(1, currentPage - PRERENDER); i <= Math.min(totalPages, currentPage + PRERENDER); i++) {
      renderSlot(i);
    }
  }, 200);
});

// ── KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentPage + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(currentPage - 1);
});
</script>
</body>
</html>
