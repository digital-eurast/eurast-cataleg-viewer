<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catàleg Tarifa — EURAST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:   #ED692C;
      --primary-h: #d45a1e;
      --surface:   #FAF6F5;
      --text:      #333436;
      --navy:      #39485A;
      --border:    #E2DCD9;
      --grey-lt:   #EBECED;
      --grey-md:   #A9A9AA;
    }

    body {
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: var(--surface);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      background: #111;
      color: #FFD700;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .08em;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .logo-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--grey-md);
      letter-spacing: .02em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--grey-lt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-h); border-color: var(--primary-h); }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--grey-lt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .page-nav button {
      background: none;
      border: none;
      color: var(--grey-md);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.1s;
    }
    .page-nav button:hover { background: var(--border); color: var(--text); }
    .page-nav button:disabled { opacity: 0.35; cursor: default; }
    .page-nav input {
      width: 46px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      text-align: center;
      border-radius: 5px;
      padding: 3px 4px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
    }
    .page-nav span { font-size: 13px; color: var(--grey-md); font-weight: 500; }

    .zoom-ctrl {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--grey-lt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .zoom-ctrl button {
      background: none;
      border: none;
      color: var(--grey-md);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 7px;
      border-radius: 4px;
      transition: all 0.1s;
      font-family: inherit;
    }
    .zoom-ctrl button:hover { background: var(--border); color: var(--text); }
    .zoom-ctrl span {
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      min-width: 38px;
      text-align: center;
    }

    .divider { width: 1px; height: 28px; background: var(--border); }

    /* ── LAYOUT ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 152px;
      background: #fff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .thumb {
      cursor: pointer;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      position: relative;
      background: var(--grey-lt);
    }
    .thumb:hover { border-color: var(--grey-md); }
    .thumb.active { border-color: var(--primary); }
    .thumb canvas { width: 100%; display: block; }
    .thumb-num {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 9px;
      font-weight: 700;
      color: rgba(51,52,54,0.7);
      background: rgba(250,246,245,0.85);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      gap: 16px;
      background: var(--surface);
    }
    .viewer::-webkit-scrollbar { width: 6px; }
    .viewer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .page-wrapper {
      box-shadow: 0 2px 16px rgba(57,72,90,0.12), 0 0 0 1px rgba(0,0,0,0.06);
      border-radius: 3px;
      overflow: hidden;
      background: #fff;
    }
    .page-wrapper canvas { display: block; }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
    }
    .loading-overlay.hidden { display: none; }

    .logo-loading {
      background: #111;
      color: #FFD700;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .1em;
      padding: 10px 20px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-progress {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }
    .loading-text {
      font-size: 13px;
      color: var(--grey-md);
      font-weight: 500;
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="logo-loading">EURAST</div>
  <div class="spinner"></div>
  <div class="loading-progress" id="loadingProgress">Carregant...</div>
  <div class="loading-text">La primera pàgina apareixerà en uns segons</div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">EURAST</div>
    <div class="logo-label">Catàleg Tarifa RCR Completa</div>
  </div>

  <div class="toolbar">
    <div class="page-nav">
      <button id="prevPage" title="Pàgina anterior" disabled>‹</button>
      <input type="number" id="pageInput" value="1" min="1">
      <span>/ <span id="totalPages">—</span></span>
      <button id="nextPage" title="Pàgina següent">›</button>
    </div>

    <div class="divider"></div>

    <div class="zoom-ctrl">
      <button id="zoomOut" title="Reduir">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" title="Ampliar">+</button>
    </div>

    <div class="divider"></div>

    <a href="cataleg.pdf" download class="btn btn-primary">
      ↓ Descarregar PDF
    </a>
  </div>
</header>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="viewer" id="viewer"></div>
</div>

<script type="module">
  import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

  const PDF_URL = 'cataleg.pdf';
  const THUMB_SCALE = 0.18;

  let pdfDoc = null;
  let currentPage = 1;
  let zoom = 1.0;
  let renderingPage = false;
  const renderedThumbs = new Set();

  const viewer   = document.getElementById('viewer');
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('loadingOverlay');
  const progress = document.getElementById('loadingProgress');

  // ── LOAD PDF ──
  const task = pdfjsLib.getDocument({ url: PDF_URL, rangeChunkSize: 65536 });
  task.onProgress = ({ loaded, total }) => {
    if (total) progress.textContent = Math.round((loaded / total) * 100) + '%';
  };

  pdfDoc = await task.promise;

  const total = pdfDoc.numPages;
  document.getElementById('totalPages').textContent = total;
  document.getElementById('pageInput').max = total;
  document.getElementById('prevPage').disabled = true;
  document.getElementById('nextPage').disabled = total <= 1;

  overlay.classList.add('hidden');

  await renderPage(1);
  buildSidebar(total);
  renderAllPages(total);

  // ── RENDER ──
  async function renderPage(num) {
    if (renderingPage) return;
    renderingPage = true;

    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: zoom * autoScale(page) });

    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';
    wrapper.id = `page-${num}`;
    wrapper.dataset.page = num;

    const canvas = document.createElement('canvas');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = viewport.width + 'px';

    wrapper.appendChild(canvas);
    viewer.appendChild(wrapper);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    renderingPage = false;
  }

  async function renderAllPages(n) {
    for (let i = 2; i <= n; i++) {
      if (document.getElementById(`page-${i}`)) continue;
      await renderPage(i);
      await new Promise(r => setTimeout(r, 0));
    }
  }

  function autoScale(page) {
    const vw = viewer.clientWidth - 60;
    return Math.min(vw / page.getViewport({ scale: 1 }).width, 1.8);
  }

  // ── SIDEBAR ──
  function buildSidebar(n) {
    for (let i = 1; i <= n; i++) {
      const thumb = document.createElement('div');
      thumb.className = 'thumb' + (i === 1 ? ' active' : '');
      thumb.id = `thumb-${i}`;
      thumb.dataset.page = i;

      const canvas = document.createElement('canvas');
      const num = document.createElement('div');
      num.className = 'thumb-num';
      num.textContent = i;

      thumb.append(canvas, num);
      sidebar.appendChild(thumb);
      thumb.addEventListener('click', () => goToPage(i));
    }

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const n = parseInt(e.target.dataset.page);
        if (renderedThumbs.has(n)) return;
        renderedThumbs.add(n);
        renderThumb(n, e.target.querySelector('canvas'));
      });
    }, { root: sidebar, rootMargin: '300px' });

    document.querySelectorAll('.thumb').forEach(t => obs.observe(t));
  }

  async function renderThumb(num, canvas) {
    const page = await pdfDoc.getPage(num);
    const vp = page.getViewport({ scale: THUMB_SCALE });
    canvas.width  = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  }

  // ── NAVIGATION ──
  function goToPage(num) {
    if (num < 1 || num > pdfDoc.numPages) return;
    currentPage = num;

    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    const thumb = document.getElementById(`thumb-${num}`);
    if (thumb) { thumb.classList.add('active'); thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

    const pageEl = document.getElementById(`page-${num}`);
    if (pageEl) pageEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.getElementById('pageInput').value = num;
    document.getElementById('prevPage').disabled = num <= 1;
    document.getElementById('nextPage').disabled = num >= pdfDoc.numPages;
  }

  // Auto-update counter on scroll
  const scrollObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting || e.intersectionRatio < 0.5) return;
      const n = parseInt(e.target.dataset.page);
      currentPage = n;
      document.getElementById('pageInput').value = n;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      const th = document.getElementById(`thumb-${n}`);
      if (th) th.classList.add('active');
      document.getElementById('prevPage').disabled = n <= 1;
      document.getElementById('nextPage').disabled = n >= pdfDoc.numPages;
    });
  }, { root: viewer, threshold: 0.5 });

  new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(node => {
      if (node.dataset?.page) scrollObs.observe(node);
    }));
  }).observe(viewer, { childList: true });

  // ── CONTROLS ──
  document.getElementById('prevPage').addEventListener('click', () => goToPage(currentPage - 1));
  document.getElementById('nextPage').addEventListener('click', () => goToPage(currentPage + 1));
  document.getElementById('pageInput').addEventListener('change', e => goToPage(parseInt(e.target.value)));

  document.getElementById('zoomIn').addEventListener('click', () => {
    zoom = Math.min(zoom + 0.25, 3.0);
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    rebuildViewer();
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    zoom = Math.max(zoom - 0.25, 0.5);
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    rebuildViewer();
  });

  async function rebuildViewer() {
    viewer.innerHTML = '';
    renderingPage = false;
    await renderPage(currentPage);
    renderAllPages(pdfDoc.numPages);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToPage(currentPage + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goToPage(currentPage - 1);
  });
</script>
</body>
</html>
