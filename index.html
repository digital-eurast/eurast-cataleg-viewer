<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catàleg Tarifa — EURAST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:   #ED692C;
      --primary-h: #d45a1e;
      --surface:   #FAF6F5;
      --text:      #333436;
      --border:    #E2DCD9;
      --grey-lt:   #EBECED;
      --grey-md:   #A9A9AA;
    }

    html, body {
      height: 100%;
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: var(--surface);
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 200;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .logo-mark {
      background: #111;
      color: #FFD700;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .08em;
      padding: 4px 9px;
      border-radius: 5px;
    }
    .logo-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--grey-md);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .divider { width: 1px; height: 24px; background: var(--border); }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--grey-lt);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 3px 7px;
    }
    .ctrl-group button {
      background: none; border: none;
      color: var(--grey-md);
      font-size: 17px; line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all .1s;
      font-family: inherit;
    }
    .ctrl-group button:hover { background: var(--border); color: var(--text); }
    .ctrl-group button:disabled { opacity: .3; cursor: default; }
    .ctrl-group input {
      width: 42px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      text-align: center;
      border-radius: 4px;
      padding: 2px 3px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
    }
    .ctrl-group span {
      font-size: 12px;
      color: var(--grey-md);
      font-weight: 500;
    }

    .btn-dl {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-dl:hover { background: var(--primary-h); }

    /* ── LAYOUT ── */
    .layout {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      display: flex;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 120px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .thumb {
      cursor: pointer;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color .15s;
      position: relative;
      background: var(--grey-lt);
      aspect-ratio: 210 / 297; /* A4 */
    }
    .thumb:hover { border-color: var(--grey-md); }
    .thumb.active { border-color: var(--primary); }
    .thumb canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
    .thumb-num {
      position: absolute;
      bottom: 2px; right: 3px;
      font-size: 9px; font-weight: 700;
      color: rgba(51,52,54,.75);
      background: rgba(250,246,245,.9);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      padding: 20px 0;
    }
    .viewer::-webkit-scrollbar { width: 7px; }
    .viewer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Each page is a fixed-size placeholder; canvas fills it when rendered */
    .page-slot {
      display: block;
      margin: 0 auto 16px;
      background: #fff;
      box-shadow: 0 2px 14px rgba(57,72,90,0.11), 0 0 0 1px rgba(0,0,0,0.05);
      border-radius: 2px;
      position: relative;
      /* width & height set by JS */
    }
    .page-slot canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── LOADING ── */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 18px;
      transition: opacity .4s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

    .logo-loading {
      background: #111;
      color: #FFD700;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: .1em;
      padding: 9px 18px;
      border-radius: 9px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-pct { font-size: 21px; font-weight: 700; color: var(--primary); }
    .loading-sub { font-size: 12px; color: var(--grey-md); font-weight: 500; }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="logo-loading">EURAST</div>
  <div class="spinner"></div>
  <div class="loading-pct" id="pct">Carregant…</div>
  <div class="loading-sub">La primera pàgina apareixerà en uns segons</div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">EURAST</div>
    <div class="logo-label">Catàleg Tarifa RCR Completa</div>
  </div>
  <div class="toolbar">
    <div class="ctrl-group">
      <button id="btnPrev" disabled>‹</button>
      <input id="pageInput" type="number" value="1" min="1">
      <span>/ <span id="totalLbl">—</span></span>
      <button id="btnNext">›</button>
    </div>
    <div class="divider"></div>
    <div class="ctrl-group">
      <button id="btnZoomOut">−</button>
      <span id="zoomLbl">100%</span>
      <button id="btnZoomIn">+</button>
    </div>
    <div class="divider"></div>
    <a class="btn-dl" href="cataleg.pdf" download>↓ Descarregar PDF</a>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="viewer"  id="viewer"></div>
</div>

<script type="module">
import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

// ── STATE ──────────────────────────────────────────────────────────
const PRERENDER  = 2;   // pages to pre-render around viewport
const UNLOAD_FAR = 8;   // unload pages farther than this
const THUMB_SCALE = 0.15;

const viewer  = document.getElementById('viewer');
const sidebar = document.getElementById('sidebar');

let pdf, totalPages, zoom = 1.0, currentPage = 1;
const slots      = [];   // DOM wrappers, index = pageNum-1
const rendered   = new Set();
const thumbDone  = new Set();

// ── LOAD ───────────────────────────────────────────────────────────
const task = pdfjsLib.getDocument({ url: 'cataleg.pdf', rangeChunkSize: 65536 });
task.onProgress = ({ loaded, total }) => {
  if (total) document.getElementById('pct').textContent =
    Math.round(loaded / total * 100) + '%';
};
pdf = await task.promise;
totalPages = pdf.numPages;

document.getElementById('totalLbl').textContent = totalPages;
document.getElementById('pageInput').max = totalPages;
document.getElementById('btnNext').disabled = totalPages <= 1;

// Hide loading
const overlay = document.getElementById('loadingOverlay');
overlay.classList.add('hidden');
setTimeout(() => overlay.remove(), 500);

// ── BUILD PLACEHOLDERS ─────────────────────────────────────────────
// Get a reference viewport to know page dimensions (most pages are the same size)
const samplePage  = await pdf.getPage(1);
const sampleVP    = samplePage.getViewport({ scale: 1 });
const sampleRatio = sampleVP.height / sampleVP.width;

function calcPageWidth() {
  return viewer.clientWidth - 48; // 24px padding each side
}

function buildSlots() {
  const w = calcPageWidth();
  viewer.innerHTML = '';
  slots.length = 0;
  rendered.clear();

  for (let i = 1; i <= totalPages; i++) {
    const h = Math.round(w * sampleRatio);
    const slot = document.createElement('div');
    slot.className  = 'page-slot';
    slot.id         = `p${i}`;
    slot.dataset.page = i;
    slot.style.width  = w + 'px';
    slot.style.height = h + 'px';
    viewer.appendChild(slot);
    slots.push(slot);
  }
}

buildSlots();

// ── RENDER PAGE INTO SLOT ──────────────────────────────────────────
const renderQueue = new Map(); // pageNum → Promise

async function renderSlot(num) {
  if (rendered.has(num)) return;
  if (renderQueue.has(num)) return renderQueue.get(num);

  const promise = (async () => {
    const slot = slots[num - 1];
    if (!slot) return;

    const page = await pdf.getPage(num);
    const scale = (zoom * calcPageWidth()) / page.getViewport({ scale: 1 }).width;
    const vp    = page.getViewport({ scale });

    // Resize slot to exact page dimensions
    slot.style.width  = vp.width  + 'px';
    slot.style.height = vp.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.width  = vp.width;
    canvas.height = vp.height;
    slot.appendChild(canvas);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    rendered.add(num);
  })();

  renderQueue.set(num, promise);
  await promise;
  renderQueue.delete(num);
}

function unloadSlot(num) {
  if (!rendered.has(num)) return;
  const slot = slots[num - 1];
  if (!slot) return;
  slot.innerHTML = '';
  rendered.delete(num);
}

// ── VIRTUAL SCROLL OBSERVER ────────────────────────────────────────
const pageObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const n = parseInt(e.target.dataset.page);
    if (e.isIntersecting) {
      currentPage = n;
      updateNav(n);
      // Render this page + neighbours
      for (let i = Math.max(1, n - PRERENDER); i <= Math.min(totalPages, n + PRERENDER); i++) {
        renderSlot(i);
      }
      // Unload far pages
      rendered.forEach(r => {
        if (Math.abs(r - n) > UNLOAD_FAR) unloadSlot(r);
      });
    }
  });
}, { root: viewer, threshold: 0.1 });

slots.forEach(s => pageObs.observe(s));

// Render first page immediately
await renderSlot(1);
renderSlot(2);

// ── SIDEBAR THUMBNAILS ─────────────────────────────────────────────
for (let i = 1; i <= totalPages; i++) {
  const thumb = document.createElement('div');
  thumb.className   = 'thumb' + (i === 1 ? ' active' : '');
  thumb.id          = `th${i}`;
  thumb.dataset.page = i;
  const canvas = document.createElement('canvas');
  const num    = document.createElement('div');
  num.className = 'thumb-num';
  num.textContent = i;
  thumb.append(canvas, num);
  sidebar.appendChild(thumb);
  thumb.addEventListener('click', () => goTo(i));
}

const thumbObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const n = parseInt(e.target.dataset.page);
    if (thumbDone.has(n)) return;
    thumbDone.add(n);
    (async () => {
      const page = await pdf.getPage(n);
      const vp   = page.getViewport({ scale: THUMB_SCALE });
      const c    = e.target.querySelector('canvas');
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    })();
  });
}, { root: sidebar, rootMargin: '400px' });

document.querySelectorAll('.thumb').forEach(t => thumbObs.observe(t));

// ── NAVIGATION ─────────────────────────────────────────────────────
function updateNav(n) {
  document.getElementById('pageInput').value = n;
  document.getElementById('btnPrev').disabled = n <= 1;
  document.getElementById('btnNext').disabled = n >= totalPages;
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  const th = document.getElementById(`th${n}`);
  if (th) { th.classList.add('active'); th.scrollIntoView({ block: 'nearest' }); }
}

function goTo(n) {
  n = Math.max(1, Math.min(totalPages, n));
  slots[n - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('btnPrev').addEventListener('click', () => goTo(currentPage - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(currentPage + 1));
document.getElementById('pageInput').addEventListener('change', e => goTo(parseInt(e.target.value) || 1));

// ── ZOOM ───────────────────────────────────────────────────────────
function applyZoom() {
  document.getElementById('zoomLbl').textContent = Math.round(zoom * 100) + '%';
  // Recalculate slot sizes and re-render visible pages
  const w = calcPageWidth() * zoom;
  slots.forEach(s => {
    s.style.width  = w + 'px';
    s.style.height = Math.round(w * sampleRatio) + 'px';
  });
  rendered.clear();
  slots.forEach(s => { s.innerHTML = ''; });
  renderSlot(currentPage);
  for (let i = Math.max(1, currentPage - PRERENDER); i <= Math.min(totalPages, currentPage + PRERENDER); i++) {
    renderSlot(i);
  }
}

document.getElementById('btnZoomIn').addEventListener('click', () => {
  zoom = Math.min(zoom + 0.25, 3.0);
  applyZoom();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  zoom = Math.max(zoom - 0.25, 0.5);
  applyZoom();
});

// ── RESIZE ────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    rendered.clear();
    slots.forEach(s => { s.innerHTML = ''; });
    const w = calcPageWidth();
    slots.forEach(s => {
      s.style.width  = w + 'px';
      s.style.height = Math.round(w * sampleRatio) + 'px';
    });
    for (let i = Math.max(1, currentPage - PRERENDER); i <= Math.min(totalPages, currentPage + PRERENDER); i++) {
      renderSlot(i);
    }
  }, 200);
});

// ── KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentPage + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(currentPage - 1);
});
</script>
</body>
</html>
